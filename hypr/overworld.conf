# Overworld Hyprland — entry point (linked as ~/.config/hypr/overworld.conf by scripts/install.sh)
# This file is ALWAYS sourced (from ~/.config/hypr/hyprland.conf, after Apothecary's line). Keep it tiny and inert:
# everything theme-specific lives behind ~/.config/overworld/active.conf, which the `overworld`
# CLI points at hypr/on.conf or hypr/off.conf.
#
# Nothing else belongs here: Apothecary's apothecary.conf is also always sourced and keeps the one
# `import-environment` + hermes-gateway restart exec-once (BRIEF §4.2).

# The switchable theme layer: hypr/on.conf (theme on) or hypr/off.conf (theme off, empty).
source = ~/.config/overworld/active.conf
