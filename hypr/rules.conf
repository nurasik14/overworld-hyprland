# Overworld Hyprland — window rules (sourced by on.conf). Hyprland 0.56 `match:` syntax.
# Later rules win over earlier ones for the same property, and this file is sourced after JaKooLit's
# WindowRules.conf, so these take precedence while the theme is on.

# superfile in kitty (SUPER+E → `kitty --class spf -e spf`): a floating 70 % sheet in the middle of the screen.
windowrule = match:class ^(spf)$, float on, center on, size (monitor_w*0.70) (monitor_h*0.70)
windowrule = match:class ^(spf)$, opacity 0.98 0.98

# Helper windows the Overworld shell may spawn (class overworld-*): float them, centred. Includes the test windows the
# build agents open on workspace 77 (overworld-test*), which then show the border and the shadow on their own.
windowrule = match:class ^(overworld-.*)$, float on, center on, size (monitor_w*0.60) (monitor_h*0.60)

# Pickers and settings-style utilities float (JaKooLit only centres some of these).
windowrule = match:class ^(nwg-look)$, float on, center on, size (monitor_w*0.60) (monitor_h*0.70)
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, float on, center on, size (monitor_w*0.50) (monitor_h*0.60)
windowrule = match:class ^(blueman-manager|\.blueman-manager-wrapped)$, float on, center on, size (monitor_w*0.50) (monitor_h*0.60)
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(kvantummanager|qt6ct|qt5ct)$, float on, center on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-hyprland)$, float on, center on, size (monitor_w*0.50) (monitor_h*0.60)
windowrule = match:class ^(swappy)$, float on, center on, size (monitor_w*0.60) (monitor_h*0.70)

# Terminals: kitty sets its own background_opacity (apps/kitty/*.conf); the compositor only adds the global
# active/inactive opacity from decorations.conf, so the blurred world shows through a little.

# Video players and the browser's fullscreen video: no blur, fully opaque, so the picture stays crisp.
windowrule = match:class ^(mpv|vlc|com.github.rafostar.Clapper|io.github.celluloid_player.Celluloid)$, no_blur on, opacity 1.0 1.0
windowrule = match:tag multimedia, no_blur on, opacity 1.0 1.0
windowrule = match:fullscreen true, opacity 1.0 1.0, no_dim on

# Picture-in-picture windows: float, pinned, no dim, no shadow on the video.
windowrule = match:title ^(Picture-in-Picture|Picture in picture)$, float on, pin on, no_dim on, no_shadow on

# Now Playing PiP + TikTok in Zen: a Zen window on a workspace you are not looking at is "suspended", Firefox then marks the
# page hidden and stops laying it out, so TikTok cannot scroll to another clip (the PiP's ⏮/⏭, the bridge's stall
# watchdog) until you look at it again. render_unfocused keeps such a window drawing (at misc:render_unfocused_fps, 15)
# so the feed keeps working from the PiP. Only windows whose title shows TikTok; the state is re-sent on a workspace change.
windowrule = match:class ^(app\.zen_browser\.zen)$, match:title .*TikTok.*, render_unfocused on
