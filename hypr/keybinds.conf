# Overworld Hyprland — keybinds (sourced by on.conf, i.e. only while the theme is on).
# Full table with what each key replaced: docs/KEYBINDS.md.
#
# 1. unbind every JaKooLit bind that collides with the Overworld set. Key names must match the
#    original bind EXACTLY as written in ~/.config/hypr/configs/Keybinds.conf (Hyprland compares the
#    key string verbatim when unbinding; "SPACE" != "Space").
# 2. bind the Overworld set.
# 3. re-home the useful JaKooLit actions we displaced so nothing is lost.

$ow = $HOME/.local/bin/overworld
$qs = qs -c overworld ipc call
$shot = $HOME/.config/overworld/repo/scripts/interact/screenshot.sh
$scriptsDir = $HOME/.config/hypr/scripts

# ---- 1. unbind JaKooLit collisions ---------------------------------------------------------------
unbind = SUPER, D                 # rofi drun launcher                       -> SUPER+D opens the creative inventory too
unbind = SUPER, SPACE             # togglefloating                           -> moved to SUPER+SHIFT+Space
unbind = SUPER, N                 # Hyprsunset.sh toggle (night light)       -> moved to SUPER+CTRL+N
unbind = SUPER SHIFT, N           # swaync-client -t -sw (swaync panel)      -> notification centre (swaync is stopped)
unbind = SUPER, W                 # WallpaperSelect.sh (rofi wallpaper menu) -> Select World
unbind = SUPER SHIFT, W           # WallpaperEffects.sh                      -> overworld wallpaper next
unbind = SUPER, T                 # ThemeChanger.sh (wallust global theme)   -> overworld toggle (Day/Night)
unbind = SUPER, G                 # togglegroup                              -> moved to SUPER+ALT+G
unbind = SUPER, I                 # layoutmsg addmaster                      -> moved to SUPER+ALT+I
unbind = SUPER SHIFT, I           # layoutmsg togglesplit (dwindle)          -> moved to SUPER+CTRL+I
unbind = SUPER, E                 # LaunchFileManager.sh (thunar)            -> superfile in kitty
unbind = SUPER, B                 # xdg-open https:// (default browser)      -> moved to SUPER+Z
unbind = SUPER SHIFT, B           # RainbowBorders-low-cpu.sh                -> not re-homed (rainbow borders are off-theme)
unbind = SUPER, Q                 # killactive                               -> overworld kill (block-break close)
# screenshots: JaKooLit's ScreenShot.sh and the user's plain Print                     -> the screenshot wrapper
unbind = , Print
unbind = ALT, Print
unbind = SUPER, Print
unbind = SUPER SHIFT, Print
unbind = SUPER CTRL, Print
unbind = SUPER CTRL SHIFT, Print
unbind = SUPER SHIFT, S
unbind = ALT SHIFT, S
# the laptop block of JaKooLit's configs/Laptops.conf: the same screenshots on F6 (no Print key)
unbind = SUPER, F6
unbind = SUPER SHIFT, F6
unbind = SUPER CTRL, F6
unbind = SUPER ALT, F6
unbind = ALT, F6
# JaKooLit actions that tear the theme down (restart waybar/swaync, `pkill qs`, restore JaKooLit's wallpaper):
unbind = SUPER SHIFT, G           # GameMode.sh                              -> overworld gamemode toggle
unbind = SUPER ALT, R             # Refresh.sh (pkill qs, restart waybar)    -> overworld repair
unbind = CTRL ALT, W              # WallpaperRandom.sh (+wallust, Refresh)   -> overworld wallpaper random
unbind = SUPER CTRL, B            # WaybarStyles.sh (waybar is off)          -> not re-homed while on
unbind = SUPER ALT, B             # WaybarLayout.sh (waybar is off)          -> not re-homed while on
unbind = SUPER CTRL ALT, B        # pkill -SIGUSR1 waybar (waybar is off)    -> not re-homed while on
unbind = SUPER SHIFT, P           # the stock-desktop Projects menu (hypr/off.conf of either theme) -> the Projects dialog while this theme is on
unbind = SUPER ALT, N             # the stock-desktop Notes menu (hypr/off.conf of either theme)    -> a new sheet on the Notes card while this theme is on

# ---- 2. Overworld binds -----------------------------------------------------------------------
# Menus
bindd = SUPER, Space, Creative inventory (launcher), exec, $qs launcher toggle
bindd = SUPER, D, Creative inventory (launcher), exec, $qs launcher toggle
bindd = SUPER, N, Multiplayer (network), exec, $qs network toggle
bindd = SUPER, Escape, Game menu (power), exec, $qs power toggle
bindd = SUPER, W, Select World (wallpapers), exec, $qs wallpapers toggle
bindd = SUPER SHIFT, W, Next wallpaper, exec, $ow wallpaper next
bindd = CTRL ALT, W, Random wallpaper, exec, $ow wallpaper random
bindd = SUPER, T, Toggle Day/Night, exec, $ow toggle
bindd = SUPER, G, Toggle desktop widgets, exec, $qs widgets toggle
bindd = SUPER, I, Chat history (notifications), exec, $qs notifications toggle
bindd = SUPER SHIFT, N, Chat history (notifications), exec, $qs notifications toggle
bindd = SUPER SHIFT, I, Peaceful (do not disturb), exec, $qs notifications dnd
bindd = SUPER, B, Brewing stand: start/pause, exec, $qs brew toggle
bindd = SUPER SHIFT, B, Brewing stand: set brew / rest time, exec, $qs brew open
bindd = SUPER SHIFT, P, Projects: add a project (dialog), exec, $qs projects open
bindd = SUPER ALT, N, Notes: a new sheet to write on, exec, $qs notes newSheet
bindd = SUPER ALT, P, Now Playing PiP (floating video mini-player) on/off, exec, $qs nowplaying toggle
bindd = SUPER, E, Superfile (file manager), exec, kitty --class spf -e spf

# The game
bindd = SUPER, Q, Mine the window (block-break close), exec, $ow kill
bindd = SUPER SHIFT, T, Chat, exec, $qs chat open
bindd = SUPER, slash, Chat with / typed, exec, $qs chat command "/"
bindd = SUPER, F1, Hide or show the HUD, exec, $qs hud toggle
bindd = SUPER, F2, Screenshot (screen), exec, $shot screen
bindd = SUPER, F3, Debug screen, exec, $qs world f3 toggle
bindd = SUPER SHIFT, F3, Debug screen with the frame graph, exec, $qs world f3graph toggle
bindd = SUPER, F4, Gamemode switcher, exec, $qs gamemode switcher
bindd = SUPER, L, Advancements, exec, $qs advancements toggle
bindd = SUPER SHIFT, L, Statistics, exec, $qs stats toggle
bindd = SUPER, O, Options, exec, $qs options toggle
bindd = SUPER SHIFT, G, Adventure mode on/off (performance), exec, $ow gamemode toggle
bindd = SUPER ALT, R, Repair the Overworld shell, exec, $ow repair

# Screenshots: "Saved screenshot as …" in chat + item pickup
bindd = , Print, Screenshot (area), exec, $shot area
bindd = SHIFT, Print, Screenshot (screen), exec, $shot screen
bindd = ALT, Print, Screenshot (active window), exec, $shot window
bindd = SUPER SHIFT, S, Screenshot (area + swappy), exec, $shot swappy
# F6 family (JaKooLit's laptop binds) through the same wrapper; the delayed ones wait first
bindd = SUPER, F6, Screenshot (screen), exec, $shot screen
bindd = SUPER SHIFT, F6, Screenshot (area), exec, $shot area
bindd = SUPER CTRL, F6, Screenshot (screen in 5 s), exec, sh -c 'sleep 5; exec "$HOME/.config/overworld/repo/scripts/interact/screenshot.sh" screen'
bindd = SUPER ALT, F6, Screenshot (screen in 10 s), exec, sh -c 'sleep 10; exec "$HOME/.config/overworld/repo/scripts/interact/screenshot.sh" screen'
bindd = ALT, F6, Screenshot (active window), exec, $shot window

# OSD: fire the Options-slider OSD in addition to JaKooLit's Volume.sh / Brightness.sh handlers (both run).
bindel = , XF86AudioRaiseVolume, exec, $qs osd volume
bindel = , XF86AudioLowerVolume, exec, $qs osd volume
bindl = , XF86AudioMute, exec, $qs osd volume
bindel = , XF86MonBrightnessUp, exec, $qs osd brightness
bindel = , XF86MonBrightnessDown, exec, $qs osd brightness

# ---- 3. re-homed JaKooLit actions ---------------------------------------------------------------
bindd = SUPER SHIFT, Space, Float current window, togglefloating,
bindd = SUPER CTRL, N, Toggle Hyprsunset (night light), exec, $scriptsDir/Hyprsunset.sh toggle
bindd = SUPER ALT, G, Toggle group, togglegroup
bindd = SUPER ALT, I, Add master (master layout), layoutmsg, addmaster
bindd = SUPER CTRL, I, Toggle split (dwindle), layoutmsg, togglesplit
bindd = SUPER, Z, Open default browser, exec, xdg-open "https://"
