# Overworld Hyprland — decorations (sourced by on.conf after colors.conf).
# Blocks, not paper: no rounding, a crisp border, a hard drop shadow like a GUI text shadow, windows on a block grid.
# Colour values for borders are NOT set here — colors.conf (per mode) owns col.active_border and friends.
# Hyprland 0.56 syntax.

general {
    border_size = 3                 # a hard pixel outline, like a selected block (JaKooLit: 1)
    gaps_in = 4                     # gaps on the 4 px GUI grid
    gaps_out = 8
    resize_on_border = true
}

decoration {
    rounding = 0                    # blocks have corners
    active_opacity = 0.94           # the world shows through a little (blurred, see below)
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.06
    dim_special = 0.35              # scrim behind the special workspace

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.17
        vibrancy_darkness = 0.0
        noise = 0.01
        contrast = 0.9
        brightness = 0.95
        new_optimizations = true
        xray = false                # blur what is behind, do not cut straight through to the wallpaper
        ignore_opacity = true
        special = true              # blur behind the special workspace
        popups = true               # blur behind popups (menus, tooltips)
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        sharp = true                # no soft falloff: the window's silhouette, moved down and to the right
        range = 1
        render_power = 4
        offset = 5 5
        scale = 1.0
        color = rgba(000000b0)
        color_inactive = rgba(00000070)
    }
}

# Layer rules for the Quickshell shell (namespaces overworld-*). Later rules win, so the catch-all comes FIRST.
# Every GUI animates itself in QML on the 20 tick clock (screens fade in 150 ms, toasts slide, /title uses tick timings):
# a Hyprland animation on top would make them arrive late and translucent, hence no_anim everywhere.
layerrule = match:namespace ^(overworld-.*)$, blur on, ignore_alpha 0.35, no_anim on

# Screens with a menu gradient behind them keep the catch-all's blur (ignore_alpha: only the panel bodies and the gradient):
#   launcher, network, power, wallpapers, notifcenter, brew, widgetsmenu, advancements, stats, options, gamemode.
# Sprites and overlays that draw over the whole desktop: no blur, or every transparent pixel would smear the windows behind.
layerrule = match:namespace ^(overworld-bar)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-bossbar)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-widgets)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-notif)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-advtoast)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-osd)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-wscard)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-chat)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-break)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-death)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-weather)$, blur off, ignore_alpha 0
layerrule = match:namespace ^(overworld-f3)$, blur off, ignore_alpha 0
# The Now Playing PiP (Overlay layer, above fullscreen): no blur behind the video or the translucent panel edge. Layers never get
# decoration:active_opacity/inactive_opacity (those are window rules), so the video stays at full opacity; the panel's own see-through
# fill is drawn in QML (widgets.opacity), the video on top of it is opaque.
layerrule = match:namespace ^(overworld-nowplaying)$, blur off, ignore_alpha 0
