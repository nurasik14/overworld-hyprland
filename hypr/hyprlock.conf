# Overworld Hyprland — hyprlock (hyprlock ≥ 0.9) = the Minecraft title screen. Linked to ~/.config/hypr/hyprlock.conf ONLY
# while the theme is on (`overworld on` moves what was there to hyprlock.conf.pre-overworld; `overworld off` restores it).
# Our panorama behind a soft blur, the OVERWORLD wordmark, a tilted yellow splash, "Day N · HH:MM", a text field and a
# Singleplayer button at the game's own GUI metrics: GUI scale 3 at 1080p, buttons 200×20 GUI px, rows 24 GUI px apart.
# Colours/fonts: ~/.config/overworld/hyprlock-vars.conf -> tokens/out/<mode>/hyprlock-vars.conf ($ow_*).
# Mojangles is crisp at 12/18/24 pt (16/24/32 px). hyprlock draws no hard shadow, so shadowed text is two labels, 3 px apart.
# NOT live-tested (hyprlock cannot be dry-run without locking the session) — see docs/INSTALL.md → Troubleshooting.

source = ~/.config/overworld/hyprlock-vars.conf
$scripts = $HOME/.config/overworld/repo/hypr/scripts
$lockart = $HOME/.config/overworld/lock.png
$pieces = $HOME/.cache/overworld/lock
$shadow = rgb(3f3f3f)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 0
    fail_timeout = 2000
}

auth {
    pam:enabled = true
}

# GUI screens fade quickly in the game: ≤ 150 ms.
animations {
    enabled = true
    bezier = snap, 0.1, 0.9, 0.2, 1
    animation = fadeIn, 1, 1.5, snap
    animation = fadeOut, 1, 1.5, snap
    animation = inputFieldColors, 1, 1, snap
    animation = inputFieldFade, 1, 1, snap
    animation = inputFieldWidth, 0
    animation = inputFieldDots, 0
}

# ---- background: the mode's panorama render (the CLI keeps lock.png -> assets/renders/lock-<day|night>.png, or -> the
#      current wallpaper when the render is missing). The renders are already soft; two passes only hide what is left.
background {
    monitor =
    path = $lockart
    color = $ow_bg0
    blur_passes = 2
    blur_size = 4
    noise = 0
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.0
    zindex = -1
}

# ---- the OVERWORLD wordmark, 1252×144 at 1:1 (hyprlock's `size` is the shorter side)
image {
    monitor =
    path = $pieces/wordmark.png
    size = 144
    rounding = 0
    border_size = 0
    reload_time = -1
    position = 0, -90
    halign = center
    valign = top
    zindex = 1
}

# ---- the splash: tilted 20°, over the wordmark's lower right corner, new line every 10 min
label {
    monitor =
    text = cmd[update:600000] $scripts/splash.sh
    color = rgb(3f3f00)
    font_size = 24
    font_family = $ow_font_ui
    rotate = 20
    position = 473, -189
    halign = center
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:600000] $scripts/splash.sh
    color = $ow_splash
    font_size = 24
    font_family = $ow_font_ui
    rotate = 20
    position = 470, -186
    halign = center
    valign = top
    zindex = 3
}

# ---- clock: Day N · HH:MM (N = day of the year, as everywhere in the shell)
label {
    monitor =
    text = cmd[update:1000] echo "Day $(date +%-j) · $(date +%H:%M)"
    color = $shadow
    font_size = 24
    font_family = $ow_font_ui
    position = 3, -285
    halign = center
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] echo "Day $(date +%-j) · $(date +%H:%M)"
    color = rgb(ffffff)
    font_size = 24
    font_family = $ow_font_ui
    position = 0, -282
    halign = center
    valign = top
    zindex = 3
}

# ---- text field, 200×20 GUI px: black fill, grey outline, white when typing, no rounding. y = height/4 + 48 GUI px, the game's first row.
input-field {
    monitor =
    size = 600, 60
    outline_thickness = 3
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.0
    dots_center = true
    dots_rounding = 0
    outer_color = $ow_fieldBorder
    inner_color = $ow_fieldFill
    font_color = $ow_fieldText
    font_family = $ow_font_ui
    check_color = $ow_fieldBorderFocus
    fail_color = $ow_chatRed
    capslock_color = $ow_chatYellow
    fade_on_empty = false
    placeholder_text = <span foreground="##707070">Enter password</span>
    fail_text = <span foreground="##ff5555">$FAIL ($ATTEMPTS)</span>
    hide_input = false
    rounding = 0
    swap_font_color = false
    position = 0, -414
    halign = center
    valign = top
    zindex = 3
}

# ---- the Singleplayer button, one row below: Enter is the same as clicking it
image {
    monitor =
    path = $pieces/button.png
    size = 60
    rounding = 0
    border_size = 0
    reload_time = -1
    position = 0, -486
    halign = center
    valign = top
    zindex = 2
}
label {
    monitor =
    text = Singleplayer
    color = $shadow
    font_size = 18
    font_family = $ow_font_ui
    position = 3, -503
    halign = center
    valign = top
    zindex = 3
}
label {
    monitor =
    text = Singleplayer
    color = rgb(ffffff)
    font_size = 18
    font_family = $ow_font_ui
    position = 0, -500
    halign = center
    valign = top
    zindex = 4
}

# ---- hint and keyboard layout (us / ru / kz) under the button
label {
    monitor =
    text = Press Enter to play · $LAYOUT
    color = $shadow
    font_size = 12
    font_family = $ow_font_ui
    position = 2, -568
    halign = center
    valign = top
    zindex = 3
}
label {
    monitor =
    text = Press Enter to play · $LAYOUT
    color = rgb(ffffff)
    font_size = 12
    font_family = $ow_font_ui
    position = 0, -566
    halign = center
    valign = top
    zindex = 4
}

# ---- bottom left, where the game prints its version: date and battery
label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B'
    color = rgb(ffffff)
    font_size = 12
    font_family = $ow_font_ui
    shadow_passes = 1
    shadow_size = 1
    position = 8, 32
    halign = left
    valign = bottom
    zindex = 3
}
label {
    monitor =
    text = cmd[update:30000] printf 'Battery %s%%' "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 || echo '–')"
    color = rgb(ffffff)
    font_size = 12
    font_family = $ow_font_ui
    shadow_passes = 1
    shadow_size = 1
    position = 8, 8
    halign = left
    valign = bottom
    zindex = 3
}

# ---- bottom right, where the game prints its copyright line: a quote, rotates every 10 min
label {
    monitor =
    text = cmd[update:600000] $scripts/quote.sh 58
    text_align = right
    color = rgb(ffffff)
    font_size = 12
    font_family = $ow_font_ui
    shadow_passes = 1
    shadow_size = 1
    position = -8, 8
    halign = right
    valign = bottom
    zindex = 3
}
