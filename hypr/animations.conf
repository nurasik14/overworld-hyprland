# Overworld Hyprland — animations (sourced by on.conf).
# Blocks are placed, not poured: windows pop in with a small overshoot, leave fast (the block-break effect in the shell
# does the drama), workspaces slide quickly. Speeds are in 100 ms units (2.5 = 250 ms).

animations {
    enabled = yes

    # Curves (name, x1, y1, x2, y2).
    bezier = place, 0.2, 1.25, 0.4, 1     # overshoots a little, then settles: a block landing on the grid
    bezier = snap, 0.1, 0.9, 0.2, 1       # quick ease-out: workspaces, moves, fades
    bezier = block, 0.1, 0.9, 0.2, 1      # same curve under the name tokens/ uses (shared.motion.easing.*.hyprland)
    bezier = toast, 0.2, 0.8, 0.2, 1      # tokens/ name too: toast-like slides

    # Windows: pop in from 85 % with `place`. Going out is almost instant: the window has already "broken" in the shell.
    animation = windows, 1, 2.5, place, popin 85%
    animation = windowsIn, 1, 2.5, place, popin 85%
    animation = windowsOut, 1, 1, snap, popin 85%
    animation = windowsMove, 1, 2.5, snap

    # Borders: static, as in the game. Also stops JaKooLit's rotating gradient loop.
    animation = border, 0
    animation = borderangle, 0

    # Fades: short. The GUI itself fades in QML, these are window opacity and dim changes.
    animation = fade, 1, 1.5, snap
    animation = fadeIn, 1, 1.5, snap
    animation = fadeOut, 1, 1.5, snap
    animation = fadeSwitch, 1, 1.5, snap
    animation = fadeShadow, 1, 1.5, snap
    animation = fadeDim, 1, 1.5, snap
    animation = fadeLayers, 1, 1.5, snap

    # Workspaces: the hotbar selection jumps, the world slides under it in 350 ms (the user likes this quick).
    animation = workspaces, 1, 3.5, snap, slide
    animation = workspacesIn, 1, 3.5, snap, slide
    animation = workspacesOut, 1, 3.5, snap, slide
    animation = specialWorkspace, 1, 3.5, snap, slidevert

    # Layers: only for layer surfaces that are not ours (rofi, wlogout, the overview). Ours are no_anim, see decorations.conf.
    animation = layers, 1, 1.5, snap, fade
    animation = layersIn, 1, 1.5, snap, fade
    animation = layersOut, 1, 1.5, snap, fade
}
