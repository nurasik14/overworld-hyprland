# Overworld Hyprland — theme ON.
# ~/.config/overworld/active.conf points here while the theme is enabled (`overworld on`).
# Sourced after the JaKooLit defaults and UserConfigs (via overworld.conf), so everything here overrides them
# for as long as the theme is on. `overworld off` points active.conf back at off.conf and `hyprctl reload`
# restores the stock values.

# 1. Colours for the current mode: ~/.config/overworld/colors.conf -> tokens/out/<mode>/hyprland-colors.conf.
#    Defines $ow_<role> variables AND sets general:col.*, decoration:shadow:color, group:col.*, misc:background_color.
source = ~/.config/overworld/colors.conf

# 2. The layer itself. NOT `./decorations.conf`: Hyprland resolves relative `source` paths against the path it
#    opened, which is the ~/.config/overworld/active.conf symlink (→ "globbing error: found no match").
#    ~/.config/overworld/repo -> <repo root> is created by scripts/install.sh.
source = ~/.config/overworld/repo/hypr/decorations.conf
source = ~/.config/overworld/repo/hypr/animations.conf
source = ~/.config/overworld/repo/hypr/rules.conf
source = ~/.config/overworld/repo/hypr/keybinds.conf

# 3. The Overworld cursor for everything Hyprland starts from now on (Xwayland, Qt and Electron read these, not gsettings).
#    `env` lines are re-read on every `hyprctl reload`: when the theme goes off, JaKooLit's ENVariables.conf sets its
#    own values again. apps/apply-mode.sh does the live part (`hyprctl setcursor`, gsettings).
env = XCURSOR_THEME,Overworld
env = HYPRCURSOR_THEME,Overworld
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# 4. Session start: only runs at Hyprland start (never on `hyprctl reload`). If the theme is enabled it stops
#    waybar/swaync/mako, starts the Quickshell shell, restarts hypridle with hypr/hypridle.conf and sets the wallpaper.
#    If ~/.config/overworld/enabled is missing it exits immediately.
exec-once = $HOME/.local/bin/overworld session-start
