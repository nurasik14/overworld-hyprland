# Overworld Hyprland — theme OFF.
# ~/.config/overworld/active.conf points here while the theme is disabled, so the Overworld layer contributes nothing
# except the one bind below.

# Projects on the stock desktop (no widget layer there): SUPER+SHIFT+P opens the rofi menu of `hypr-projects` (Enter toggles a project,
# "+ Add project…" asks for a title, "✕ Remove…" deletes, Esc closes). `--if-stock` makes it do nothing while Overworld or Apothecary
# is on (each theme binds the same key to its own dialog), and the menu takes a lock, so Apothecary's identical line in its off.conf
# (both files load when both themes are off) never opens two windows. Free on JaKooLit (checked against `hyprctl binds`).
bindd = SUPER SHIFT, P, Projects (stock desktop: rofi menu), exec, ~/.local/bin/hypr-projects menu --if-stock
