# Overworld Hyprland — starship preset (apps/starship/overworld.toml)
# apps/install.sh appends both token palettes (tokens/out/<mode>/starship-palette.toml) to this file into
# ~/.config/overworld/starship/overworld.toml and apps/apply-mode.sh flips the `palette =` line below.
# Two lines:   ❤ user  dir  branch status ... [Day]    (hearts = the prompt badge, [Day]/[Night] = the world's mode)
# Needs a Nerd Font: Monocraft (patched) has every glyph used here.
"$schema" = 'https://starship.rs/config-schema.json'
palette = "overworld_light"
add_newline = true
command_timeout = 800

format = """
[  ](bold textOnSeal bg:seal)$username$hostname[](fg:seal bg:surfaceAlt)$directory[](fg:surfaceAlt)\
$git_branch$git_status$git_state\
$python$nodejs$rust$golang$lua\
$cmd_duration$jobs$battery
$character"""

right_format = "$custom$time"

[username]
show_always = false
style_user = "bold textOnSeal bg:seal"
style_root = "bold textOnSeal bg:error"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "textOnSeal bg:seal"
format = "[@$hostname ]($style)"

[directory]
style = "bold text bg:surfaceAlt"
read_only_style = "seal bg:surfaceAlt"
read_only = " 󰌾"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
format = "[ $path ]($style)[$read_only]($read_only_style)"
[directory.substitutions]
"~" = "󰋜"
"Projects" = "󰏗"
"Documents" = "󰈙"
"Downloads" = "󰇚"
"Media" = "󰋩"

[git_branch]
symbol = " "
style = "accent2"
format = " [$symbol$branch(:$remote_branch)]($style)"

[git_status]
style = "plum"
format = "[ $all_status$ahead_behind]($style)"
conflicted = "󰞇"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕${ahead_count}${behind_count}"
untracked = "?${count}"
stashed = "󰆼"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "warning"
format = " [$state( $progress_current/$progress_total)]($style)"

# XP: how long the last command took
[cmd_duration]
min_time = 2000
style = "xp"
format = " [󰔟 $duration]($style)"

[jobs]
symbol = "󰐊"
style = "accent2"
format = " [$symbol$number]($style)"

# hearts only show up when the battery is low, like the game's heart row jiggling
[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = ""
unknown_symbol = ""
format = " [$symbol $percentage]($style)"
[[battery.display]]
threshold = 30
style = "bold seal"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold seal)"
vimcmd_symbol = "[❮](bold accent2)"

# [Day] / [Night] — follows ~/.config/overworld/mode
[custom.world]
command = 'case "$(cat ~/.config/overworld/mode 2>/dev/null)" in dark) echo Night ;; *) echo Day ;; esac'
when = 'test -e ~/.config/overworld/enabled'
style = "bold accent2"
format = "[\\[$output\\]]($style) "

[time]
disabled = false
style = "textMuted"
format = "[$time]($style)"
time_format = "%H:%M"

[python]
symbol = " "
style = "jade"
format = " [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\))]($style)"
[nodejs]
symbol = " "
style = "success"
format = " [$symbol($version)]($style)"
[rust]
symbol = " "
style = "accent2"
format = " [$symbol($version)]($style)"
[golang]
symbol = " "
style = "indigo"
format = " [$symbol($version)]($style)"
[lua]
symbol = " "
style = "indigo"
format = " [$symbol($version)]($style)"
