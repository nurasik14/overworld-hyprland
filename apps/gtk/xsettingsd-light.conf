# overworld (Day) — xsettingsd (X11/XWayland GTK apps). Linked as ~/.config/xsettingsd/xsettingsd.conf while the theme is on. Net/ThemeName stays a real installed theme; the Minecraft look comes from gtk.css; cursor theme is set by the parent.
Net/ThemeName "Flat-Remix-GTK-Blue-Light"
Net/IconThemeName "Papirus-Light"
Gtk/CursorThemeSize 24
Gtk/FontName "Noto Sans 10"
Gtk/DecorationLayout "icon:minimize,maximize,close"
Gtk/EnableAnimations 1
Gtk/MenuImages 1
Gtk/ButtonImages 1
Gtk/PrimaryButtonWarpsSlider 1
Gtk/ToolbarStyle 3
Net/CursorBlink 1
Net/CursorBlinkTime 1000
Gdk/WindowScalingFactor 1
Gdk/UnscaledDPI 98304
