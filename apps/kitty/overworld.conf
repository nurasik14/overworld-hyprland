# Overworld Hyprland — kitty (Day/Night). Template: apps/install.sh renders it per mode into
# ~/.config/overworld/kitty/overworld-<light|dark>.conf (@COLORS@ -> token colours, tab-slot overrides appended).
# It is included last from ~/.config/kitty/kitty.conf through ~/.config/overworld/kitty/current.conf, which
# apps/apply-mode.sh flips between the rendered file and off.conf (empty).

include ~/.config/overworld/kitty/colors-@MODE@.conf

# Monocraft (Nerd-Font patched, has the powerline/devicons glyphs). It is only crisp when 1 font pixel is a
# whole number of screen pixels: em 9/18/27 px = 6.75 / 13.5 / 20.25 pt at 96 dpi (design-director). 13.5 pt gives a
# 12 x 27 px cell (fastfetch's logo is sized for it); change here if you want it smaller.
font_family      family="Monocraft"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
disable_ligatures never

# the game's block cursor, no blink animation, no trail
cursor_shape            block
cursor_blink_interval   0
cursor_trail            0

window_padding_width    6
background_opacity      0.88
dynamic_background_opacity yes
dim_opacity             0.85
window_border_width     1px

# tab bar = hotbar: every tab is a slot, the active one gets the white selection frame (apps/kitty/tab_bar.py,
# linked to ~/.config/kitty/tab_bar.py by apps/install.sh)
tab_bar_edge            bottom
tab_bar_style           custom
tab_bar_min_tabs        2
tab_bar_margin_width    2
tab_bar_margin_height   2 0
tab_title_template      " {index} {title} "
active_tab_title_template " {index} {title} "
tab_activity_symbol     "!"
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_max_length    24

enable_audio_bell       no
visual_bell_duration    0.0
bell_on_tab             "! "

url_style               straight
underline_hyperlinks    hover
confirm_os_window_close 0
